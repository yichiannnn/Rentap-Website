<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fixtures & Results — RENTAP XVII</title>
  <meta name="description" content="Fixtures, results, standings and brackets for RENTAP XVII — 26–27 September 2026, Schulcampus Werderau, Nürnberg." />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    /* ── HERO ── */
    .fx-hero { padding-top: calc(var(--nav-h) + 2.5rem); padding-bottom: 1.75rem; background: var(--ink); position: relative; overflow: hidden; }
    .fx-hero-pattern {
      position: absolute; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none'%3E%3Cpolygon points='30,4 56,30 30,56 4,30' stroke='%23A8200D' stroke-width='0.8' opacity='0.2'/%3E%3Cpolygon points='30,14 46,30 30,46 14,30' stroke='%23C8922A' stroke-width='0.5' opacity='0.15'/%3E%3C/g%3E%3C/svg%3E");
      opacity: 0.5;
    }
    .fx-hero-pattern::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 80% 90% at 50% 30%, transparent 20%, var(--ink) 88%); }
    .fx-hero-inner { position: relative; z-index: 1; }
    .back-link { display: inline-flex; align-items: center; gap: .5rem; color: var(--text-muted); font-size: .9rem; margin-bottom: 1.5rem; transition: color 200ms; }
    .back-link:hover { color: var(--light); }
    .fx-title { font-family: var(--display); font-size: clamp(3rem, 9vw, 5.5rem); letter-spacing: .05em; color: var(--light); line-height: 1; display: flex; align-items: center; gap: .9rem; }
    .live-dot { width: .8rem; height: .8rem; border-radius: 50%; background: var(--red); flex-shrink: 0; box-shadow: 0 0 0 0 rgba(168,32,13,.7); animation: livepulse 1.8s infinite; }
    @keyframes livepulse { 0% { box-shadow: 0 0 0 0 rgba(168,32,13,.6); } 70% { box-shadow: 0 0 0 12px rgba(168,32,13,0); } 100% { box-shadow: 0 0 0 0 rgba(168,32,13,0); } }
    .fx-subtitle { color: var(--text-muted); font-size: .95rem; letter-spacing: .08em; text-transform: uppercase; margin-top: .4rem; }
    .updated-stamp { color: var(--text-muted); font-size: .78rem; margin-top: .5rem; }
    .updated-stamp .warn { color: var(--gold); }

    /* ── FIND MY MATCHES ── */
    .fx-search { position: relative; margin-top: 1.5rem; max-width: 540px; }
    .fx-search label { display: block; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); font-weight: 700; margin-bottom: .45rem; }
    .fx-search-row { display: flex; gap: .5rem; }
    .fx-search input { flex: 1; min-width: 0; background: rgba(0,0,0,.35); border: 1px solid rgba(200,146,42,.35); border-radius: var(--radius); padding: .7rem .95rem; color: var(--light); font-family: var(--body); font-size: 1rem; min-height: 46px; -webkit-appearance: none; }
    .fx-search input::placeholder { color: var(--text-muted); }
    .fx-search input:focus { outline: none; border-color: var(--gold); }
    .fx-search .btn { padding: .55rem 1rem; }
    .fx-suggest { position: absolute; left: 0; right: 0; top: 100%; margin-top: .35rem; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-lg); list-style: none; z-index: 45; max-height: 280px; overflow-y: auto; box-shadow: 0 14px 34px rgba(0,0,0,.45); }
    .fx-suggest li button { width: 100%; text-align: left; background: none; border: none; color: var(--text); padding: .65rem .95rem; font-family: var(--body); font-size: .95rem; cursor: pointer; display: flex; justify-content: space-between; gap: .6rem; align-items: baseline; }
    .fx-suggest li button:hover, .fx-suggest li button:focus { background: rgba(200,146,42,.14); color: var(--light); outline: none; }
    .fx-suggest .sub { color: var(--text-muted); font-size: .76rem; white-space: nowrap; }
    .fx-suggest .none { padding: .65rem .95rem; color: var(--text-muted); font-size: .88rem; }

    /* personal timetable */
    .fx-me { background: var(--surface-2); border-bottom: 1px solid var(--border); padding-block: 1.6rem 1.9rem; }
    .fx-me-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .5rem 1rem; margin-bottom: 1rem; }
    .fx-me-head h2 { font-family: var(--display); font-size: 1.9rem; letter-spacing: .05em; color: var(--light); line-height: 1; }
    .fx-me-head .meta { color: var(--text-muted); font-size: .85rem; }
    .fx-me-head .btn { margin-left: auto; padding: .4rem .9rem; font-size: .8rem; }
    .fx-me-day { font-family: var(--display); font-size: 1.15rem; letter-spacing: .08em; color: var(--gold); margin: 1rem 0 .5rem; }
    .fx-me-list { list-style: none; display: grid; gap: .4rem; }
    .fx-me-row { display: grid; grid-template-columns: 6.2rem 1fr auto; gap: .4rem .9rem; align-items: center; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--gold); border-radius: var(--radius-lg); padding: .6rem .85rem; text-align: left; color: var(--text); font-family: var(--body); cursor: pointer; width: 100%; }
    .fx-me-row:hover { border-color: rgba(200,146,42,.5); }
    .fx-me-row.iq { border-left-style: dashed; opacity: .68; }
    .fx-me-row .when { font-family: var(--display); font-size: 1.15rem; letter-spacing: .05em; color: var(--light); line-height: 1.1; }
    .fx-me-row .when small { display: block; font-family: var(--body); font-size: .68rem; letter-spacing: .04em; color: var(--text-muted); }
    .fx-me-row .what { font-size: .92rem; min-width: 0; }
    .fx-me-row .what b { color: var(--light); }
    .fx-me-row .what span { display: block; color: var(--text-muted); font-size: .76rem; margin-top: .1rem; }
    .fx-me-row .res { font-family: var(--display); font-size: 1.15rem; letter-spacing: .05em; color: var(--light); text-align: right; }
    .fx-me-row .res small { display: block; font-family: var(--body); font-size: .66rem; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
    .fx-me-row .res.live small { color: var(--red); }
    .fx-me-empty { color: var(--text-muted); font-size: .9rem; }

    /* ── SPORT TABS ── */
    .live-tabs-wrap { position: sticky; top: var(--nav-h); z-index: 30; background: var(--surface); border-bottom: 2px solid var(--border); }
    .live-tabs { display: flex; gap: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; max-width: 1200px; margin-inline: auto; padding-inline: clamp(1.25rem, 5vw, 3rem); }
    .live-tabs::-webkit-scrollbar { display: none; }
    .live-tab { background: none; border: none; cursor: pointer; padding: .9rem 1.1rem; font-family: var(--body); font-weight: 600; font-size: .92rem; color: var(--text-muted); border-bottom: 3px solid transparent; margin-bottom: -2px; display: inline-flex; align-items: center; gap: .5rem; white-space: nowrap; transition: color 200ms, border-color 200ms; }
    .live-tab svg { width: 20px; height: 20px; }
    .live-tab:hover { color: var(--light); }
    .live-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

    /* ── PANEL ── */
    .fx-panel { padding-block: clamp(1.5rem, 4vw, 3rem); background: var(--surface); min-height: 60vh; }
    .fx-toolbar { display: flex; flex-wrap: wrap; gap: .6rem 1rem; align-items: center; margin-bottom: 1.5rem; }
    .fx-toolbar .spacer { flex: 1; }
    .fx-seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; background: var(--surface-2); }
    .fx-seg button { background: none; border: none; color: var(--text-muted); padding: .45rem .95rem; font-family: var(--body); font-weight: 600; font-size: .84rem; cursor: pointer; min-height: 36px; }
    .fx-seg button.on { background: var(--gold); color: var(--ink); }
    .fx-chips { display: flex; flex-wrap: wrap; gap: .4rem; }
    .fx-cat { --c: var(--gold); border: 1px solid var(--border); background: var(--surface-2); color: var(--text); border-radius: 999px; padding: .35rem .8rem; font-family: var(--body); font-size: .8rem; font-weight: 700; cursor: pointer; display: inline-flex; gap: .45rem; align-items: center; min-height: 34px; }
    .fx-cat .dot { width: .55rem; height: .55rem; border-radius: 50%; background: var(--c); }
    .fx-cat .n { color: var(--text-muted); font-weight: 600; }
    .fx-cat.on { border-color: var(--c); color: var(--light); background: rgba(200,146,42,.14); }
    .block { margin-bottom: 2.75rem; }
    .block-title { font-family: var(--display); font-size: 1.5rem; letter-spacing: .06em; color: var(--gold); margin-bottom: 1.1rem; padding-bottom: .5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .block-title .count-badge { font-family: var(--body); font-size: .72rem; font-weight: 700; color: var(--text-muted); letter-spacing: .05em; text-transform: uppercase; }
    .fx-dayhead { font-family: var(--display); font-size: 1.2rem; letter-spacing: .08em; color: var(--light); margin: 1.4rem 0 .9rem; display: flex; align-items: center; gap: .6rem; }
    .fx-dayhead::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .fx-note { color: var(--text-muted); font-size: .85rem; line-height: 1.6; }
    details.fx-format { border: 1px dashed var(--border); border-radius: var(--radius-lg); padding: .8rem 1rem; margin-top: 1rem; }
    details.fx-format summary { cursor: pointer; color: var(--gold); font-weight: 700; font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; list-style: none; }
    details.fx-format summary::-webkit-details-marker { display: none; }
    details.fx-format p { color: var(--text-muted); font-size: .88rem; line-height: 1.6; margin-top: .6rem; max-width: none; }

    /* placements: frisbee tally / basketball 1st-2nd-3rd */
    .fx-podium { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .5rem; }
    .fx-podium-row { display: flex; align-items: center; gap: .8rem; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: .7rem .9rem; }
    .fx-podium-row.gold { border-color: var(--gold); background: rgba(200,146,42,.1); }
    .fx-podium-row.silver { border-color: #b9c2c9; }
    .fx-podium-row.bronze { border-color: #b3762f; }
    .fx-rank { font-family: var(--display); font-size: 1.1rem; letter-spacing: .04em; color: var(--gold); min-width: 2.6rem; }
    .fx-pname { flex: 1; color: var(--light); font-weight: 600; }
    .fx-tally { color: var(--text-muted); font-size: .82rem; white-space: nowrap; }

    /* track: races with per-lane finishing times */
    .fx-race { border-bottom: 1px solid var(--border); padding: .9rem 0; }
    .fx-race:last-child { border-bottom: none; }
    .fx-race-head { display: flex; justify-content: space-between; align-items: baseline; gap: .8rem; margin-bottom: .5rem; }
    .fx-race-head b { color: var(--light); font-size: .95rem; }
    .fx-race-head span { color: var(--text-muted); font-size: .8rem; }
    .fx-race-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .3rem; }
    .fx-race-list li { display: flex; align-items: center; gap: .7rem; padding: .4rem .6rem; border-radius: var(--radius); background: var(--surface-2); }
    .fx-race-list li.gold { background: rgba(200,146,42,.12); }
    .fx-race-list .fx-rank { min-width: 1.8rem; font-size: .95rem; }
    .fx-race-list .fx-pname { font-size: .9rem; font-weight: 500; color: var(--text); }
    .fx-race-list .fx-pname small { color: var(--text-muted); font-weight: 400; }
    .fx-race-list .fx-time { font-variant-numeric: tabular-nums; color: var(--gold); font-weight: 700; font-size: .88rem; }

    /* ── BADGES / TEAM BUTTONS ── */
    .fx-badge { --c: var(--gold); display: inline-grid; place-items: center; width: 2.15rem; height: 2.15rem; background: var(--c); color: #fff; font-family: var(--display); font-size: .95rem; letter-spacing: .04em; line-height: 1; clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%); flex-shrink: 0; text-shadow: 0 1px 2px rgba(0,0,0,.45); }
    .fx-badge.lg { width: 3.4rem; height: 3.4rem; font-size: 1.5rem; }
    .fx-badge.ink { color: var(--ink); text-shadow: none; }
    .fx-code { --c: var(--gold); display: inline-block; font-family: var(--display); font-size: .92rem; letter-spacing: .08em; padding: .12rem .45rem; border-radius: 3px; background: var(--c); color: #fff; line-height: 1.15; flex-shrink: 0; }
    .fx-code.ink { color: var(--ink); }
    .fx-team { display: inline-flex; align-items: center; gap: .55rem; background: none; border: none; color: var(--light); font-family: var(--body); font-weight: 600; font-size: 1rem; cursor: pointer; text-align: left; padding: .2rem .3rem; border-radius: var(--radius); max-width: 100%; }
    .fx-team:hover { background: rgba(255,255,255,.05); }
    .fx-team.win { color: var(--gold); }
    .fx-team .nm { min-width: 0; }
    .fx-team .more { color: var(--text-muted); font-weight: 400; font-size: 1.1rem; line-height: 1; }
    .fx-tbd { color: var(--text-muted); font-style: italic; font-weight: 500; font-size: .92rem; padding: .2rem .3rem; display: inline-block; }

    /* ── GROUP CARDS ── */
    .fx-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.25rem; }
    .fx-group { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
    .fx-group-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; padding: .8rem 1rem; background: rgba(200,146,42,.08); border-bottom: 1px solid var(--border); }
    .fx-group-head h3 { font-family: var(--display); font-size: 1.4rem; letter-spacing: .08em; color: var(--gold); }
    .fx-group-head span { font-size: .7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; text-align: right; }
    .table-wrap { overflow-x: auto; }
    table.standings { width: 100%; border-collapse: collapse; font-size: .85rem; }
    .standings th { color: var(--text-muted); text-align: center; padding: .5rem .35rem; font-size: .66rem; letter-spacing: .05em; text-transform: uppercase; border-bottom: 1px solid var(--border); }
    .standings th.left, .standings td.left { text-align: left; }
    .standings td { padding: .45rem .35rem; text-align: center; border-bottom: 1px solid var(--border); color: var(--text); }
    .standings tr:last-child td { border-bottom: none; }
    .standings td.pos { color: var(--text-muted); width: 1.6rem; font-variant-numeric: tabular-nums; }
    .standings tr.adv td.pos { border-left: 3px solid var(--gold); color: var(--gold); font-weight: 700; }
    .standings tr.bru td.pos { border-left: 3px dashed var(--gold); }
    .standings td.pts { color: var(--gold); font-weight: 700; }
    .standings .fx-team { font-size: .92rem; padding: .1rem .2rem; gap: .5rem; }
    .standings .fx-badge { width: 1.75rem; height: 1.75rem; font-size: .78rem; }
    .form-dots { display: inline-flex; gap: .2rem; justify-content: center; }
    .fd { width: .5rem; height: .5rem; border-radius: 50%; display: inline-block; }
    .fd.W { background: var(--gold); } .fd.D { background: var(--text-muted); } .fd.L { background: var(--red); }
    .fx-group-foot { padding: .6rem 1rem; font-size: .75rem; color: var(--text-muted); border-top: 1px solid var(--border); display: flex; align-items: center; gap: .5rem; }
    .fx-rail { display: inline-block; width: 1rem; height: 3px; background: var(--gold); border-radius: 2px; }
    .fx-rail.dash { background: repeating-linear-gradient(90deg, var(--gold) 0 3px, transparent 3px 5px); }

    /* ── TIME RAIL + MATCH CARDS ── */
    .fx-slot { display: grid; grid-template-columns: 4.6rem 1fr; gap: .5rem 1rem; margin-bottom: 1.1rem; }
    .fx-slot-time { font-family: var(--display); font-size: 1.4rem; letter-spacing: .06em; color: var(--gold); padding-top: .55rem; line-height: 1; }
    .fx-slot-time small { display: block; font-family: var(--body); font-size: .68rem; letter-spacing: .05em; color: var(--text-muted); margin-top: .25rem; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: .9rem; }
    .cards.one { grid-template-columns: minmax(0, 620px); }
    .mcard { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; scroll-margin-top: calc(var(--nav-h) + 4rem); }
    .mcard--live { border-color: rgba(168,32,13,.55); box-shadow: 0 0 0 1px rgba(168,32,13,.25); }
    .mcard--flash { animation: cardflash 1.4s var(--ease-out); }
    @keyframes cardflash { 0% { box-shadow: 0 0 0 4px rgba(200,146,42,.6); } 100% { box-shadow: 0 0 0 0 rgba(200,146,42,0); } }
    .mcard-top { display: flex; align-items: center; justify-content: space-between; gap: .6rem; padding: .5rem .85rem; font-size: .7rem; letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border); }
    .mcard-stage { font-weight: 700; display: inline-flex; align-items: center; gap: .4rem; min-width: 0; }
    .fx-venue { display: inline-flex; align-items: center; gap: .3rem; white-space: nowrap; }
    .fx-venue svg { width: 12px; height: 12px; }
    .badge-live { display: inline-flex; align-items: center; gap: .35rem; background: var(--red); color: #fff; padding: .12rem .5rem; border-radius: 999px; font-weight: 700; font-size: .66rem; letter-spacing: .08em; }
    .badge-live::before { content: ''; width: .4rem; height: .4rem; border-radius: 50%; background: #fff; animation: livepulse 1.8s infinite; }
    .badge-ft { color: var(--gold); font-weight: 700; }
    .mcard-body { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: .5rem; padding: .9rem .85rem; }
    .mc-team { min-width: 0; display: flex; align-items: center; }
    .mc-team.a { justify-content: flex-end; text-align: right; }
    .mc-team.a .fx-team { flex-direction: row-reverse; text-align: right; }
    .mc-center { text-align: center; min-width: 84px; }
    .mc-score { font-family: var(--display); font-size: 2.3rem; color: var(--light); line-height: 1; letter-spacing: .04em; }
    .mc-score .sep { color: var(--text-muted); margin: 0 .16rem; }
    .mc-clock { font-size: .76rem; color: var(--red); font-weight: 700; margin-top: .25rem; letter-spacing: .05em; }
    .mc-clock.ft { color: var(--gold); }
    .mc-kick { font-family: var(--display); font-size: 1.5rem; color: var(--light); letter-spacing: .05em; line-height: 1; }
    .mc-kick small { display: block; font-family: var(--body); font-size: .66rem; color: var(--text-muted); letter-spacing: .06em; text-transform: uppercase; margin-top: .25rem; }
    .mc-sets { font-size: .76rem; color: var(--text-muted); margin-top: .3rem; font-variant-numeric: tabular-nums; }
    .mcard-foot { display: flex; flex-wrap: wrap; gap: .3rem .9rem; padding: 0 .85rem .65rem; font-size: .74rem; color: var(--text-muted); }
    .mcard-foot b { color: var(--text); font-weight: 600; }

    /* football timeline */
    .fx-tl { list-style: none; border-top: 1px solid var(--border); padding: .5rem .9rem .7rem; }
    .fx-tl-row { display: grid; grid-template-columns: 2.2rem 1.3rem 1fr; align-items: center; gap: .5rem; padding: .3rem 0; font-size: .86rem; color: var(--text); }
    .fx-tl-min { color: var(--gold); font-weight: 700; font-size: .8rem; text-align: right; }
    .fx-tl-ico { color: var(--text-muted); display: flex; }
    .fx-tl-ico svg { width: 15px; height: 15px; }
    .fx-tl-txt .who { color: var(--light); }
    .fx-tl-txt .team { color: var(--text-muted); font-size: .78rem; }
    .fx-tl-row.fresh { animation: freshpop 1.6s var(--ease-out); }
    @keyframes freshpop { 0% { background: rgba(200,146,42,.25); } 100% { background: transparent; } }
    .card-yellow rect { fill: #d9a919; stroke: #d9a919; }
    .card-red rect { fill: var(--red); stroke: var(--red); }
    details.finished-tl > summary { cursor: pointer; list-style: none; padding: .5rem .9rem; border-top: 1px solid var(--border); font-size: .76rem; color: var(--text-muted); letter-spacing: .04em; }
    details.finished-tl > summary::-webkit-details-marker { display: none; }
    details.finished-tl[open] > summary { color: var(--gold); }

    /* ── BRACKET ── */
    .bracket { display: flex; gap: 1.5rem; overflow-x: auto; padding-bottom: .5rem; -webkit-overflow-scrolling: touch; align-items: stretch; }
    .bkt-round { display: flex; flex-direction: column; justify-content: space-around; gap: 1rem; min-width: 230px; flex: 1; position: relative; }
    .bkt-round h4 { font-family: var(--display); font-size: .95rem; letter-spacing: .08em; color: var(--text-muted); text-align: center; margin-bottom: .2rem; text-transform: uppercase; }
    .bkt-node { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: .55rem .7rem; font-size: .84rem; position: relative; scroll-margin-top: calc(var(--nav-h) + 4rem); }
    .bkt-node.final { border-color: rgba(200,146,42,.55); box-shadow: 0 0 0 1px rgba(200,146,42,.2); }
    .bkt-node.live { border-color: rgba(168,32,13,.55); }
    .bkt-meta { display: flex; justify-content: space-between; gap: .5rem; font-size: .66rem; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); margin-bottom: .35rem; }

    .fx-tri .v1 { grid-column: 2; grid-row: 1; } .fx-tri .e12 { grid-column: 1; grid-row: 2; } .fx-tri .e13 { grid-column: 3; grid-row: 2; }

    .fx-vertex { display: flex; flex-direction: column; align-items: center; gap: .4rem; background: none; border: none; color: var(--light); font-family: var(--body); font-weight: 700; font-size: .95rem; cursor: pointer; text-align: center; }

    .fx-board td.t { position: sticky; left: 0; background: var(--surface); font-family: var(--display); font-size: 1.05rem; letter-spacing: .06em; color: var(--light); padding: .45rem .6rem; z-index: 1; white-space: nowrap; vertical-align: middle; }

    .fx-mini { list-style: none; display: flex; flex-direction: column; gap: .35rem; }
    .fx-mini li { display: grid; grid-template-columns: 5.8rem 1fr auto; gap: .5rem; font-size: .86rem; color: var(--text); padding: .4rem .55rem; background: rgba(255,255,255,.035); border-radius: var(--radius); align-items: center; }
    .fx-mini li.iq { opacity: .6; }
    .fx-mini .when { color: var(--gold); font-weight: 700; font-variant-numeric: tabular-nums; font-size: .8rem; }
    .fx-mini .what { min-width: 0; }
    .fx-mini .where { color: var(--text-muted); font-size: .72rem; display: block; }
    .fx-mini .res { font-family: var(--display); letter-spacing: .05em; color: var(--light); font-size: 1.05rem; white-space: nowrap; }
    .fx-mini .res.live { color: var(--red); }
    .fx-vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: .75rem; align-items: start; margin: .5rem 0 .25rem; }
    .fx-vs .side { min-width: 0; }
    .fx-vs .side.b { text-align: right; }
    .fx-vs .side .fx-code { margin-bottom: .35rem; }
    .fx-vs .side ul { list-style: none; }
    .fx-vs .side li { color: var(--light); font-weight: 600; font-size: .92rem; line-height: 1.35; }
    .fx-vs .mid { text-align: center; padding-top: .3rem; }
    .fx-empty-note { color: var(--text-muted); font-size: .85rem; }

    /* ── EMPTY STATE ── */
    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-muted); border: 1px dashed var(--border); border-radius: var(--radius-lg); }

    .empty-state p { max-width: none; }

    @media (max-width: 900px) {
      .fx-groups { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .modal-overlay.fx-sheet-overlay { align-items: flex-end; padding: 0; }

      .fx-players { columns: 1; }

      .fx-me-row { grid-template-columns: 4.8rem 1fr auto; padding: .55rem .7rem; }
      .fx-tri { gap: .4rem .35rem; }
      .fx-leg { padding: .22rem .55rem; font-size: .68rem; }
      .bkt-round { min-width: 200px; }
      .fx-h2h { min-width: 520px; }
    }
  </style>
</head>

<script>
// ══════════════════════════ STATE ══════════════════════════
const DAYS = {
  1: { date: '2026-09-26', short: 'Sat 26', long: 'Saturday 26 Sep' },
  2: { date: '2026-09-27', short: 'Sun 27', long: 'Sunday 27 Sep' },
};
const CAT_COLOUR = { MS: '#C8922A', MD: '#A8200D', XD: '#EDE8DE', WD: '#0F8A4D', WS: '#7A8572', OD: '#A8200D' };
// notes on the court boards that are not fixtures: the lunch break, and the
// Hall 3 courts that basketball takes over on Saturday evening
const BOARD_NOTES = {
  badminton:      { 1: { breaks: ['12:30'], blocked: [{ from: '17:30', cols: [4, 5, 6], label: 'Basketball' }] }, 2: {} },
  'table-tennis': { 1: { breaks: ['12:30'] }, 2: {} },
};
const ICON_PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';
const ICON_INFO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>';

const state = {
  family: 'football',
  day: 'all',                 // 'all' | 1 | 2
  cat: {},                    // family -> 'all' | slug
  view: window.innerWidth <= 640 ? 'list' : 'board',
  person: null,
};
const data = {};              // slug -> { teams, matches, standings }
const teamById = {};          // slug -> id -> team
const stamps = {};            // fetch key -> generated_at
const rendered = {};          // family -> true once drawn
let seenEventIds = new Set();
let pollTimer = null, offline = false, allLoaded = false, allPromise = null;
let sheetOpener = null;

const $ = sel => document.querySelector(sel);
const norm = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const slugify = s => norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const famSlugs = f => (FAMILIES[f] || { slugs: [] }).slugs;
const cfgOf = slug => SPORT_CONFIG[slug] || {};

// ══════════════════════════ TIME (always Europe/Berlin) ══════════════════════════
function fmtT(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleTimeString('en-GB', { timeZone: 'Europe/Berlin', hour: '2-digit', minute: '2-digit' });
}
function dateKey(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleDateString('en-CA', { timeZone: 'Europe/Berlin' });
}
function dayOf(m) {
  const k = dateKey(m.scheduled_at);
  return k === DAYS[1].date ? 1 : k === DAYS[2].date ? 2 : 0;
}
function durationOf(slug, m) { return m.duration_min || cfgOf(slug).duration || 30; }
function endIso(slug, m) { return m.scheduled_at ? new Date(new Date(m.scheduled_at).getTime() + durationOf(slug, m) * 60000).toISOString() : ''; }
function whenLabel(m) { return m.scheduled_at ? (DAYS[dayOf(m)] ? DAYS[dayOf(m)].short + ' ' : '') + fmtT(m.scheduled_at) : 'TBD'; }
function todayDay() {
  const k = new Date().toLocaleDateString('en-CA', { timeZone: 'Europe/Berlin' });
  return k === DAYS[1].date ? 1 : k === DAYS[2].date ? 2 : 'all';
}

// ══════════════════════════ DATA ══════════════════════════
function fetchKey(f) { return famSlugs(f).length === 1 ? 'sport=' + famSlugs(f)[0] : 'family=' + f; }
function ingest(slug, payload) {
  if (slug === 'track') {
    // races, not team-vs-team matches: keep empty teams/matches so the
    // generic anyLive()/hasAny helpers that read those keys still work
    data.track = { teams: [], matches: [], standings: {}, events: payload.events || [] };
    return;
  }
  data[slug] = {
    teams: payload.teams || [], matches: payload.matches || [], standings: payload.standings || {},
    placements: payload.placements || [],
  };
  teamById[slug] = {};
  data[slug].teams.forEach(t => { teamById[slug][t.id] = t; });
}
async function loadKey(key, probe) {
  let url = '/api/live?' + key;
  if (probe && stamps[key]) url += '&since=' + encodeURIComponent(stamps[key]);
  const res = await fetch(url, { headers: { Accept: 'application/json' } });
  if (!res.ok) throw new Error('bad status ' + res.status);
  const json = await res.json();
  if (json.unchanged) return false;
  stamps[key] = json.generated_at || '';
  if (json.sports) Object.keys(json.sports).forEach(s => ingest(s, json.sports[s]));
  else ingest(json.sport, json);

}
function loadAll() {
  if (!allPromise) {
    allPromise = loadKey('family=all', false).then(() => { allLoaded = true; })
      .catch(e => { allPromise = null; throw e; });
  }
  return allPromise;
}

function anyLive(slugs) {
  return slugs.some(s => data[s] && data[s].matches.some(m => m.status === 'live' || m.status === 'halftime'));
}
async function poll(probe) {
  const f = state.family;
  try {
    const changed = await loadKey(fetchKey(f), probe);
    offline = false;
    if (changed || !rendered[f]) { render(); rendered[f] = true; }
    if (changed && state.person) renderMe();
    stampUpdated();
  } catch (e) {
    offline = true;
    stampUpdated();
    if (!rendered[f]) $('#panel').innerHTML = emptyBlock('Could not reach the live server. Retrying…');
  }
  scheduleNext();
}
function restartPolling() {
  if (pollTimer) clearTimeout(pollTimer);
  poll(false);
}
function scheduleNext() {
  if (pollTimer) clearTimeout(pollTimer);
  if (document.visibilityState === 'hidden') return;
  const interval = anyLive(famSlugs(state.family)) ? 10000 : 60000;
  pollTimer = setTimeout(() => poll(true), interval);
}
function stampUpdated() {
  const t = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  $('#updatedStamp').innerHTML = offline
    ? '<span class="warn">Offline — showing last update ' + t + '</span>'
    : 'Updated ' + t + ' · times are local to Nürnberg';
  $('#liveDot').hidden = !anyLive(Object.keys(data));
}

// ══════════════════════════ SMALL HELPERS ══════════════════════════
function initials(name) {
  const words = name.split(/\s+/).filter(w => w && !/^(and|the|of|de|fc|rc|sc|fsv)$/i.test(w));
  const src = words.length ? words : name.split(/\s+/);
  return src.slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
}
function isLightColour(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if (!m) return false;
  const n = parseInt(m[1], 16);
  const r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (r * 299 + g * 587 + b * 114) / 1000 > 150;
}
function safeColour(c) { return /^#[0-9a-fA-F]{6}$/.test(c || '') ? c : '#C8922A'; }
function badgeHTML(team, cls) {

// public label of a side: team name, or the entry code for racket entries (names on tap)

}
function isRacketSlug(slug) { return ['badminton', 'table-tennis'].includes(cfgOf(slug).family); }
function sideHTML(slug, m, side, win) {

function sideText(slug, m, side) {

}
function venueHTML(m) { return m.label ? `<span class="fx-venue">${ICON_PIN}${esc(m.label)}</span>` : ''; }
function isLive(m) { return m.status === 'live' || m.status === 'halftime'; }

function koLabel(slug, m) {

}

}
function resultHTML(slug, m) {

function statusTop(m) {

function emptyBlock(msg) { return `<div class="empty-state">${ICON_INFO}<p>${msg}</p></div>`; }

// ══════════════════════════ MATCH CARD ══════════════════════════
function matchCard(slug, m, opts) {
  opts = opts || {};
  const cfg = cfgOf(slug);
  const aWin = isDone(m) && m.score_a > m.score_b, bWin = isDone(m) && m.score_b > m.score_a;
  const catTag = opts.showCat && cfg.short ? `<span class="fx-code" style="--c:${CAT_COLOUR[cfg.short] || '#C8922A'}${isLightColour(CAT_COLOUR[cfg.short]) ? ';color:var(--ink)' : ''}">${cfg.short}</span>` : '';
  let card = `<div class="mcard${isLive(m) ? ' mcard--live' : ''}" id="m-${m.id}" data-mid="${m.id}">
    <div class="mcard-top"><span class="mcard-stage">${catTag}${esc(stageLabel(slug, m))}</span>${venueHTML(m)}${statusTop(m)}</div>
    <div class="mcard-body">
      <div class="mc-team a">${sideHTML(slug, m, 'a', aWin)}</div>

    </div>`;

function timelineHTML(slug, m, animateFresh) {
  const evs = m.events.slice().sort((x, y) => (y.minute || 0) - (x.minute || 0) || y.id - x.id);
  const rows = evs.map(e => {
    const fresh = animateFresh && rendered[state.family] && !seenEventIds.has(e.id);
    seenEventIds.add(e.id);
    const teamLabelTxt = e.team_id === m.team_a_id ? sideText(slug, m, 'a') : (e.team_id === m.team_b_id ? sideText(slug, m, 'b') : '');

function evIcon(type) {

    case 'red': return '<svg class="card-red" viewBox="0 0 24 24"><rect x="7" y="4" width="10" height="16" rx="1.5"/></svg>';
    case 'sub': return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 3 21 7 17 11"/><path d="M21 7H9"/><polyline points="7 21 3 17 7 13"/><path d="M3 17h12"/></svg>';

function evLabel(type) { return { goal: 'Goal', penalty_goal: 'Penalty', own_goal: 'Own goal', yellow: 'Yellow card', red: 'Red card', sub: 'Substitution', note: 'Note' }[type] || type; }
function evSuffix(type) { return type === 'penalty_goal' ? ' · pen.' : type === 'own_goal' ? ' · o.g.' : ''; }
function tickClocks() {

// ══════════════════════════ SHARED BLOCKS ══════════════════════════
function dayBar() {
  const opts = [['all', 'All'], [1, DAYS[1].short], [2, DAYS[2].short]];
  return `<div class="fx-seg" role="group" aria-label="Day">${opts.map(([v, l]) =>
    `<button type="button" data-day="${v}" class="${String(state.day) === String(v) ? 'on' : ''}" aria-pressed="${String(state.day) === String(v)}">${l}</button>`).join('')}</div>`;
}
function daysToShow() { return state.day === 'all' ? [1, 2] : [Number(state.day)]; }
// chronological match list on a time rail, grouped by kick-off time
function scheduleBlock(entries, title, opts) {
  opts = opts || {};
  let html = `<div class="block"><div class="block-title">${title}<span class="count-badge">${entries.length} match${entries.length === 1 ? '' : 'es'}</span></div>`;
  let shown = 0;
  daysToShow().forEach(d => {
    const list = entries.filter(x => dayOf(x.m) === d).sort(byTime);
    if (!list.length) return;
    shown += list.length;
    html += `<h4 class="fx-dayhead">${DAYS[d].long}</h4>`;
    const slots = new Map();
    list.forEach(x => { const k = x.m.scheduled_at; if (!slots.has(k)) slots.set(k, []); slots.get(k).push(x); });
    slots.forEach((xs, k) => {
      html += `<div class="fx-slot"><div class="fx-slot-time">${esc(fmtT(k))}</div><div class="cards${opts.single ? ' one' : ''}">${xs.map(x => matchCard(x.slug, x.m, opts)).join('')}</div></div>`;
    });
  });
  const unscheduled = entries.filter(x => !dayOf(x.m));
  if (unscheduled.length && state.day === 'all') {
    shown += unscheduled.length;
    html += `<h4 class="fx-dayhead">Time to be confirmed</h4><div class="cards">${unscheduled.map(x => matchCard(x.slug, x.m, opts)).join('')}</div>`;
  }
  if (!shown) html += emptyBlock('No matches on this day.');

}
function standingsTable(slug, rows, opts) {

  let html = `<div class="table-wrap"><table class="standings"><thead><tr>
    <th class="pos">#</th><th class="left">${isRacketSlug(slug) ? 'Entry' : 'Team'}</th><th>P</th><th class="hide-sm">W</th><th class="hide-sm">D</th><th class="hide-sm">L</th>

  rows.forEach((r, i) => {

    const adv = cfg.advance && i < cfg.advance ? 'adv' : (bru && bru === r.team_id ? 'bru' : '');
    const gd = r.gf - r.ga;
    html += `<tr class="${adv}"><td class="pos">${i + 1}</td>
      <td class="left">${teamBtn(slug, team)}</td>
      <td>${r.p}</td><td class="hide-sm">${r.w}</td><td class="hide-sm">${r.d}</td><td class="hide-sm">${r.l}</td>
      <td>${gd > 0 ? '+' + gd : gd}</td><td class="pts">${r.pts}</td>

}
function groupCard(slug, g, rows, opts) {
  const cfg = cfgOf(slug);
  const title = g ? 'Group ' + g : (cfg.groups ? 'Group' : 'League');
  const n = rows.length;

}
function bracketBlock(slug, kos, opts) {
  opts = opts || {};
  if (!kos.length) return '';
  const order = ['quarter', 'semi', 'final'];
  const rounds = order.filter(st => kos.some(m => m.stage === st));
  const third = kos.find(m => m.stage === 'third');
  const winnerOnly = cfgOf(slug).winnerOnly;
  const node = (m, cls) => {
    const fin = isDone(m), aWin = fin && m.score_a > m.score_b, bWin = fin && m.score_b > m.score_a;
    const show = m.status !== 'scheduled' && !winnerOnly;
    return `<div class="bkt-node${cls ? ' ' + cls : ''}${isLive(m) ? ' live' : ''}" id="m-${m.id}">
      <div class="bkt-meta"><b>${esc(koLabel(slug, m))}</b><span>${esc(whenLabel(m))}${m.label ? ' · ' + esc(m.label) : ''}</span>${isLive(m) ? '<span class="badge-live">LIVE</span>' : ''}</div>
      <div class="bkt-line${aWin ? ' win' : ''}">${sideHTML(slug, m, 'a', aWin)}<span class="s">${show ? m.score_a : (aWin ? '✓' : '')}</span></div>
      <div class="bkt-line${bWin ? ' win' : ''}">${sideHTML(slug, m, 'b', bWin)}<span class="s">${show ? m.score_b : (bWin ? '✓' : '')}</span></div>
    </div>`;
  };
  let html = `<div class="block"><div class="block-title">${opts.title || 'Knockout'}</div><div class="bracket">`;
  rounds.forEach((st, i) => {
    const ms = kos.filter(m => m.stage === st).sort((a, b) => a.id - b.id);
    const titles = { quarter: 'Quarter-finals', semi: 'Semi-finals', final: 'Final' };
    html += `<div class="bkt-round${i < rounds.length - 1 ? ' has-next' : ''}"><h4>${titles[st]}</h4>${ms.map(m => node(m, st === 'final' ? 'final' : '')).join('')}`;
    if (st === 'final' && third) html += `<div class="bkt-third"><h4>3rd place</h4>${node(third, '')}</div>`;
    html += '</div>';
  });
  if (!rounds.includes('final') && third) html += `<div class="bkt-round"><h4>3rd place</h4>${node(third, '')}</div>`;
  return html + '</div></div>';
}
function squadsBlock(slug, teams, title) {

// ══════════════════════════ PLACEMENTS (frisbee tally, basketball 1st/2nd/3rd) ══════════════════════════
const ORDINAL = n => n + (n % 10 === 1 && n % 100 !== 11 ? 'st' : n % 10 === 2 && n % 100 !== 12 ? 'nd' : n % 10 === 3 && n % 100 !== 13 ? 'rd' : 'th');
function placementsHTML(f) {
  const slug = famSlugs(f)[0];
  const list = (data[slug] && data[slug].placements) || [];
  if (!list.length) return emptyBlock('Results appear here once entries are recorded.');
  const isFrisbee = slug === 'frisbee';
  const groups = {};
  list.forEach(p => (groups[p.group_name || ''] ||= []).push(p));
  let html = '';
  Object.keys(groups).sort().forEach(g => {
    const rows = groups[g].slice().sort(isFrisbee
      ? (a, b) => (b.gold_tries || 0) - (a.gold_tries || 0) || (b.silver_tries || 0) - (a.silver_tries || 0) || a.name.localeCompare(b.name)
      : (a, b) => (a.place || 99) - (b.place || 99) || a.name.localeCompare(b.name));
    const title = g ? 'Group ' + esc(g) : FAMILIES[f].name + ' Results';
    html += `<div class="block"><div class="block-title">${title}<span class="count-badge">${rows.length} ${isFrisbee ? 'teams' : 'entries'}</span></div><ol class="fx-podium">`;
    rows.forEach((p, i) => {
      const rank = isFrisbee ? i + 1 : p.place;
      const medal = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
      const detail = isFrisbee ? `<span class="fx-tally">${p.gold_tries || 0} gold · ${p.silver_tries || 0} silver</span>` : '';
      html += `<li class="fx-podium-row ${medal}"><span class="fx-rank">${rank ? ORDINAL(rank) : '—'}</span><span class="fx-pname">${esc(p.name)}</span>${detail}</li>`;
    });
    html += '</ol></div>';
  });
  return html;
}

    <div class="pulse-item"><div class="n">${avg}</div><div class="k">Goals / match</div></div>

      <span class="disc-chip"><span class="disc-swatch y"></span>${disc[t].y}</span><span class="disc-chip"><span class="disc-swatch r"></span>${disc[t].r}</span></span></div>`).join('')}</div>`;
  }

  if (!team) return;
  const cfg = cfgOf(slug);
  const events = teamEvents(slug, team);
  const duties = famSlugs(cfg.family).flatMap(s => (data[s] ? data[s].matches : []).filter(m => m.referee && m.referee === team.name).map(m => ({ slug: s, m })));
  let html = `<div class="fx-sheet-head">${badgeHTML(team, 'lg')}<div><h2 id="fxSheetTitle">${esc(team.name)}</h2>
    <p>${esc(sportLabel(slug))}${team.group_name ? ' · Group ' + esc(team.group_name) : ''}${team.code ? ' · ' + esc(team.code) : ''}</p></div></div>`;
  html += `<h3>${team.code ? 'Players' : 'Squad'} (${(team.players || []).length})</h3>`;
  html += (team.players || []).length
    ? `<ol class="fx-players">${team.players.map(p => `<li><span class="num">${p.number != null ? p.number : '·'}</span><span>${esc(p.name)}</span></li>`).join('')}</ol>`
    : '<p class="fx-empty-note">Squad to be announced.</p>';
  html += `<h3>Fixtures</h3>` + (events.length ? miniList(slug, events) : '<p class="fx-empty-note">No fixtures yet.</p>');
  if (duties.length) {
    html += `<h3>Referee duties</h3><ul class="fx-mini">${duties.sort(byTime).map(({ slug: s, m }) =>
      `<li><span class="when">${esc(whenLabel(m))}</span><span class="what">${esc(sideText(s, m, 'a'))} v ${esc(sideText(s, m, 'b'))}<span class="where">${esc(stageLabel(s, m))}${m.label ? ' · ' + esc(m.label) : ''}</span></span><span></span></li>`).join('')}</ul>`;
  }
  openSheet(html, opener);
}
function openMatchSheet(slug, id, opener) {
  const m = data[slug] && data[slug].matches.find(x => String(x.id) === String(id));
  if (!m) return;
  const cfg = cfgOf(slug);
  const side = (s) => {
    const t = teamById[slug][m['team_' + s + '_id']];
    if (!t) return `<span class="fx-tbd">${esc(m['placeholder_' + s] || 'TBD')}</span>`;
    return `${badgeHTML(t)}<ul>${(t.players || []).map(p => `<li>${esc(p.name)}</li>`).join('') || `<li>${esc(t.name)}</li>`}</ul>`;
  };
  let html = `<div class="fx-sheet-head"><div><h2 id="fxSheetTitle">${esc(stageLabel(slug, m))}${m.stage !== 'group' ? ' · ' + esc(koLabel(slug, m)) : ''}</h2>
    <p>${esc(sportLabel(slug))} · ${esc(whenLabel(m))}${m.scheduled_at ? '–' + esc(fmtT(endIso(slug, m))) : ''}${m.label ? ' · ' + esc(m.label) : ''}</p></div></div>`;
  html += `<div class="fx-vs"><div class="side a">${side('a')}</div><div class="mid">${resultHTML(slug, m)}${m.status === 'scheduled' ? '<div class="mc-clock ft" style="color:var(--text-muted)">v</div>' : ''}</div><div class="side b">${side('b')}</div></div>`;
  if (m.referee) html += `<p class="fx-note">Referee: ${esc(m.referee)}</p>`;
  if (cfg.events && (m.events || []).length) html += `<h3>Timeline</h3>${timelineHTML(slug, m, false)}`;
  openSheet(html, opener);
}

// ══════════════════════════ FIND MY MATCHES ══════════════════════════
let searchIndex = null;
function buildIndex() {
  const byName = new Map();
  Object.keys(data).forEach(slug => {
    data[slug].teams.forEach(t => (t.players || []).forEach(p => {
      const key = norm(p.name);
      if (!key) return;
      if (!byName.has(key)) byName.set(key, { name: p.name, key, memberships: [] });
      byName.get(key).memberships.push({ slug, team: t });
    }));
  });
  searchIndex = Array.from(byName.values()).sort((a, b) => a.name.localeCompare(b.name));
}
function suggest(q) {
  const ul = $('#fxSuggest');
  const input = $('#fxSearch');
  const nq = norm(q);
  if (nq.length < 2 || !searchIndex) { ul.hidden = true; input.setAttribute('aria-expanded', 'false'); return; }
  const hits = searchIndex.filter(p => p.key.includes(nq)).slice(0, 8);
  ul.innerHTML = hits.length
    ? hits.map(p => `<li role="option"><button type="button" data-person="${esc(p.key)}">${esc(p.name)}<span class="sub">${esc([...new Set(p.memberships.map(x => FAMILIES[cfgOf(x.slug).family].name))].join(' · '))}</span></button></li>`).join('')
    : '<li class="none">No player with that name — try a different spelling.</li>';
  ul.hidden = false;
  input.setAttribute('aria-expanded', 'true');
}
function selectPerson(key) {
  const p = searchIndex && searchIndex.find(x => x.key === key);
  if (!p) return;
  state.person = p.key;
  $('#fxSearch').value = p.name;
  $('#fxSuggest').hidden = true;
  $('#fxSearch').setAttribute('aria-expanded', 'false');
  $('#fxClear').hidden = false;
  try { localStorage.setItem('fx-me', p.key); } catch (_) {}
  renderMe();
  $('#fxMe').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function clearPerson() {
  state.person = null;
  $('#fxSearch').value = '';
  $('#fxClear').hidden = true;
  $('#fxMe').hidden = true;
  $('#fxMeBody').innerHTML = '';
  try { localStorage.removeItem('fx-me'); } catch (_) {}
}
function renderMe() {
  if (!state.person || !searchIndex) return;
  const p = searchIndex.find(x => x.key === state.person);
  if (!p) return;
  const rows = [];
  p.memberships.forEach(({ slug, team }) => {
    teamEvents(slug, team).forEach(ev => rows.push({ slug, team, ...ev }));
  });
  rows.sort((a, b) => byTime({ m: a.m }, { m: b.m }) || a.slug.localeCompare(b.slug));
  const fixed = rows.filter(r => r.cert === 'fixed').length;
  const sports = [...new Set(p.memberships.map(x => sportLabel(x.slug) + (x.team.code ? ' ' + x.team.code : '')))];
  let html = `<div class="fx-me-head"><h2>${esc(p.name)}</h2><span class="meta">${fixed} match${fixed === 1 ? '' : 'es'} · ${rows.length - fixed} if qualified · ${esc(sports.join(' · '))}</span><button class="btn btn-ghost" type="button" id="fxMeClear">Clear</button></div>`;
  if (!rows.length) html += '<p class="fx-me-empty">No matches found for this name yet.</p>';
  [1, 2, 0].forEach(d => {
    const list = rows.filter(r => dayOf(r.m) === d);
    if (!list.length) return;
    html += `<div class="fx-me-day">${d ? DAYS[d].long : 'Time to be confirmed'}</div><ul class="fx-me-list">`;
    list.forEach(r => {
      const cfg = cfgOf(r.slug);
      const res = r.m.status === 'scheduled' ? `<span class="res"><small>${esc(r.m.label || '')}</small></span>`
        : `<span class="res${isLive(r.m) ? ' live' : ''}">${r.m.score_a}–${r.m.score_b}<small>${isLive(r.m) ? 'Live' : 'Full time'}</small></span>`;
      html += `<li><button class="fx-me-row${r.cert === 'if qualified' ? ' iq' : ''}" type="button" data-goto="${cfg.family}|${r.slug}|${r.m.id}">
        <span class="when">${esc(fmtT(r.m.scheduled_at) || 'TBD')}<small>${r.m.scheduled_at ? 'to ' + esc(fmtT(endIso(r.slug, r.m))) : ''}</small></span>
        <span class="what"><b>${esc(sportLabel(r.slug))}</b> · ${esc(r.vs)}<span>${esc(stageLabel(r.slug, r.m))}${r.m.label ? ' · ' + esc(r.m.label) : ''}${r.cert === 'if qualified' ? ' · if qualified' : ''}${r.team.code ? ' · you are ' + esc(r.team.code) : ''}</span></span>${res}</button></li>`;
    });
    html += '</ul>';
  });
  $('#fxMeBody').innerHTML = html;
  $('#fxMe').hidden = false;
}
async function ensureIndex() {
  if (searchIndex) return;
  try { await loadAll(); buildIndex(); } catch (_) { /* offline: suggestions stay empty */ }
}

// ══════════════════════════ EVENTS ══════════════════════════
document.addEventListener('click', e => {
  const t = e.target.closest('[data-family],[data-day],[data-cat],[data-view],[data-team],[data-match],[data-jump],[data-person],[data-goto],#fxMeClear,#fxClear,#fxSheetClose');
  if (!t) return;
  if (t.dataset.family) { selectFamily(t.dataset.family); return; }
  if (t.dataset.day) { state.day = t.dataset.day === 'all' ? 'all' : Number(t.dataset.day); render(); return; }
  if (t.dataset.cat) { state.cat[state.family] = t.dataset.cat; writeHash(); render(); return; }
  if (t.dataset.view) { state.view = t.dataset.view; render(); return; }
  if (t.dataset.team) { const [slug, id] = t.dataset.team.split('|'); openTeamSheet(slug, Number(id), t); return; }
  if (t.dataset.match) { const [slug, id] = t.dataset.match.split('|'); openMatchSheet(slug, id, t); return; }
  if (t.dataset.jump) { jumpTo(t.dataset.jump); return; }
  if (t.dataset.person) { selectPerson(t.dataset.person); return; }
  if (t.dataset.goto) {
    const [f, slug, id] = t.dataset.goto.split('|');
    if (famSlugs(f).length > 1) state.cat[f] = slug;
    const d = data[slug] && data[slug].matches.find(m => String(m.id) === id);
    if (d && dayOf(d)) state.day = dayOf(d);
    if (famSlugs(f).length > 1 && state.view === 'board' && d && d.stage === 'group') state.view = 'list';
    selectFamily(f);
    setTimeout(() => jumpTo('m-' + id, true), 80);
    return;
  }
  if (t.id === 'fxMeClear' || t.id === 'fxClear') { clearPerson(); return; }
  if (t.id === 'fxSheetClose') closeSheet();
});
function jumpTo(id, flash) {
  const el = document.getElementById(id);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.add('mcard--flash');
  setTimeout(() => el.classList.remove('mcard--flash'), 1500);
}
$('#fxSheet').addEventListener('click', e => { if (e.target === e.currentTarget) closeSheet(); });
document.addEventListener('keydown', e => {
  const ov = $('#fxSheet');
  if (e.key === 'Escape') { if (!ov.hidden) closeSheet(); else { $('#fxSuggest').hidden = true; } return; }
  if (e.key === 'Tab' && !ov.hidden) {   // keep focus inside the dialog
    const f = ov.querySelectorAll('button, [href], input, [tabindex]:not([tabindex="-1"])');
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
const searchEl = $('#fxSearch');
searchEl.addEventListener('focus', ensureIndex);
searchEl.addEventListener('input', async () => { await ensureIndex(); suggest(searchEl.value); });
searchEl.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { const b = $('#fxSuggest button'); if (b) { e.preventDefault(); b.focus(); } }
  if (e.key === 'Enter') { const b = $('#fxSuggest button'); if (b && !$('#fxSuggest').hidden) { e.preventDefault(); b.click(); } }
});
$('#fxSuggest').addEventListener('keydown', e => {
  const items = Array.from($('#fxSuggest').querySelectorAll('button'));
  const i = items.indexOf(document.activeElement);
  if (e.key === 'ArrowDown' && i < items.length - 1) { e.preventDefault(); items[i + 1].focus(); }
  if (e.key === 'ArrowUp') { e.preventDefault(); if (i > 0) items[i - 1].focus(); else searchEl.focus(); }
});
document.addEventListener('click', e => { if (!e.target.closest('.fx-search')) $('#fxSuggest').hidden = true; });

// mobile nav (subpages do not load script.js)
const navToggle = $('#navToggle'), navLinks = $('#navLinks');
navToggle.addEventListener('click', () => {
  const open = navLinks.classList.toggle('open');
  navToggle.classList.toggle('open', open);
  navToggle.setAttribute('aria-expanded', String(open));
});

window.addEventListener('hashchange', applyHash);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') poll(true);
  else if (pollTimer) clearTimeout(pollTimer);
});
setInterval(tickClocks, 30000);

// ══════════════════════════ INIT ══════════════════════════
(function init() {
  state.day = todayDay();
  buildTabs();
  const parts = (location.hash || '').replace('#', '').split('/');
  if (FIXTURE_ORDER.includes(parts[0])) state.family = parts[0];
  $('#panel').innerHTML = loadingHTML();
  markActiveTab();
  restartPolling();
  if (parts[1]) setTimeout(() => selectFamily(state.family, parts[1]), 400);
  let saved = '';
  try { saved = localStorage.getItem('fx-me') || ''; } catch (_) {}
  if (saved) ensureIndex().then(() => { if (searchIndex && searchIndex.some(p => p.key === saved)) selectPerson(saved); });
})();
</script>
