<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Merchandise — RENTAP XVII</title>
    <meta name="description"
        content="Official RENTAP XVII merchandise — 26–27 September 2026, Nürnberg." />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet" />
    <style>
        .bz-hero {
            padding-top: calc(var(--nav-h) + 2.5rem);
            padding-bottom: 1.5rem;
            background: var(--ink);
            position: relative;
            overflow: hidden;
        }

        .bz-hero-pattern {
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none'%3E%3Cpolygon points='30,4 56,30 30,56 4,30' stroke='%23A8200D' stroke-width='0.8' opacity='0.2'/%3E%3Cpolygon points='30,14 46,30 30,46 14,30' stroke='%23C8922A' stroke-width='0.5' opacity='0.15'/%3E%3C/g%3E%3C/svg%3E");
            opacity: 0.5;
        }

        .bz-hero-pattern::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 80% 90% at 50% 30%, transparent 20%, var(--ink) 88%);
        }

        .bz-hero-inner {
            position: relative;
            z-index: 1;
        }

        .bz-title {
            font-family: var(--display);
            font-size: clamp(3rem, 9vw, 5.5rem);
            letter-spacing: .05em;
            color: var(--light);
            line-height: 1;
        }

        .bz-subtitle {
            color: var(--text-muted);
            font-size: .95rem;
            letter-spacing: .08em;
            text-transform: uppercase;
            margin-top: .4rem;
        }

        .bz-strip {
            color: var(--gold);
            font-size: .88rem;
            margin-top: .6rem;
        }

        .bz-panel {
            padding-block: clamp(2rem, 5vw, 3.5rem);
            background: var(--surface);
            min-height: 60vh;
        }

        .bz-intro {
            color: var(--text-muted);
            font-size: .95rem;
            margin-bottom: 1.5rem;
            max-width: 60ch;
            line-height: 1.6;
        }

        .sold-chip {
            font-size: .62rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: var(--light);
            background: var(--red);
            padding: .08rem .4rem;
            border-radius: 999px;
            margin-left: .4rem;
        }

        /* merch grid */
        .merch-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.25rem;
        }

        .merch-card {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .merch-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            background: var(--ink);
        }

        .merch-noimg {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: var(--ink);
            border-bottom: 1px dashed var(--border);
        }

        .merch-body {
            padding: 1rem 1.1rem 1.2rem;
        }

        .merch-name {
            color: var(--light);
            font-weight: 700;
            font-size: 1rem;
        }

        .merch-price {
            color: var(--gold);
            font-weight: 700;
            margin-top: .3rem;
            font-variant-numeric: tabular-nums;
        }

        .merch-sizes {
            color: var(--text-muted);
            font-size: .8rem;
            margin-top: .25rem;
        }

        .merch-desc {
            color: var(--text);
            font-size: .85rem;
            line-height: 1.5;
            margin-top: .5rem;
        }

        .merch-card.sold {
            opacity: .55;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
            border: 1px dashed var(--border);
            border-radius: var(--radius-lg);
        }

        .empty-state svg {
            width: 2.5rem;
            height: 2.5rem;
            color: var(--border);
            margin-bottom: .8rem;
        }

        .retry-note {
            color: var(--text-muted);
            font-size: .82rem;
            margin-top: .8rem;
        }
    </style>
</head>

<body>

    <header class="navbar scrolled" id="navbar">
        <div class="nav-inner">
            <a href="index.html" class="nav-logo">RENTAP<span>XVII</span></a>
            <nav aria-label="Main navigation">
                <ul class="nav-links">
                    <li><a href="index.html#about">About</a></li>
                    <li><a href="index.html#sports">Sports</a></li>
                    <li><a href="index.html#schedule">Schedule</a></li>
                    <li><a href="bazaar.html">Bazaar</a></li>
                    <li><a href="merch.html" class="nav-cta">Merch</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="bz-hero">
        <div class="bz-hero-pattern" aria-hidden="true"></div>
        <div class="container bz-hero-inner">
            <h1 class="bz-title">MERCHANDISE</h1>
            <p class="bz-subtitle">Official RENTAP XVII Merch</p>
            <p class="bz-strip">Take home a piece of RENTAP XVII.</p>
        </div>
    </section>

    <main class="bz-panel">
        <div class="container">
            <div id="panel-merch"></div>
        </div>
    </main>

    <footer class="footer" style="margin-top:0;">
        <div class="container">
            <div class="footer-bottom" style="border-top:none;padding-top:0;">
                <p>© 2026 RENTAP XVII. All rights reserved.</p>
                <div class="footer-legal">
                    <a href="impressum.html">Impressum</a>
                    <a href="datenschutz.html">Datenschutz</a>
                    <a href="agb.html">AGB</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="live-shared.js"></script>
    <script>
        let merch = null;

        function imgUrl(id) { return '/api/content?image=' + encodeURIComponent(id); }

        function loading(msg) {
            return `<div class="empty-state"><p>${esc(msg)}</p></div>`;
        }
        function emptyState(msg) {
            return `<div class="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
    <p>${esc(msg)}</p></div>`;
        }

        function renderMerch() {
            const panel = document.getElementById('panel-merch');
            if (merch === null) { panel.innerHTML = loading('Loading merchandise…'); return; }
            const intro = `<p class="bz-intro">Official RENTAP XVII merchandise, sold at the info desk during the event.</p>`;
            if (!merch.length) { panel.innerHTML = intro + emptyState('Merch drop coming soon.'); return; }
            const cards = merch.map(m => {
                const img = m.image_id
                    ? `<img class="merch-img" src="${imgUrl(m.image_id)}" alt="${esc(m.name)}" loading="lazy" width="400" height="400" />`
                    : `<div class="merch-noimg" aria-hidden="true"></div>`;
                const sold = !m.available ? '<span class="sold-chip">Sold out</span>' : '';
                return `<div class="merch-card ${m.available ? '' : 'sold'}">
      ${img}
      <div class="merch-body">
        <div class="merch-name">${esc(m.name)}${sold}</div>
        <div class="merch-price">${esc(fmtPrice(m.price_cents))}</div>
        ${m.sizes ? `<div class="merch-sizes">Sizes: ${esc(m.sizes)}</div>` : ''}
        ${m.description ? `<div class="merch-desc">${esc(m.description)}</div>` : ''}
      </div>
    </div>`;
            }).join('');
            panel.innerHTML = intro + `<div class="merch-grid">${cards}</div>`;
        }

        async function loadMerch() {
            try {
                const res = await fetch('/api/content?type=merch', { headers: { Accept: 'application/json' } });
                if (!res.ok) throw new Error('bad');
                const data = await res.json();
                merch = data.merch || [];
            } catch (_) {
                if (merch === null) merch = [];
                document.getElementById('panel-merch').innerHTML =
                    `<p class="bz-intro">Official RENTAP XVII merchandise, sold at the info desk during the event.</p>` +
                    emptyState('Merch drop coming soon.') +
                    '<p class="retry-note">(Could not reach the server — retrying shortly.)</p>';
                return;
            }
            renderMerch();
        }

        // pinned-announcement banner (inline)
        function mountBanner() {
            const ICON = {
                urgent: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
                important: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
                info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
            };
            const CLOSE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
            const navbar = document.getElementById('navbar');
            if (!navbar) return;
            fetch('/api/content?type=announcements', { headers: { Accept: 'application/json' } })
                .then(r => r.ok ? r.json() : null)
                .then(d => {
                    const ann = ((d && d.announcements) || []).find(a => a.pinned);
                    if (!ann) return;
                    const lvl = ['info', 'important', 'urgent'].includes(ann.level) ? ann.level : 'info';
                    const body = (ann.body || '').toString();
                    const bodyHtml = body.length <= 140
                        ? '<span class="ann-banner-body"> — ' + esc(body) + '</span>'
                        : ' <a class="ann-banner-more" href="announcements.html">Read more</a>';
                    const el = document.createElement('div');
                    el.className = 'ann-banner ann-banner--' + lvl;
                    el.setAttribute('role', 'status');
                    el.innerHTML = '<div class="ann-banner-inner"><span class="ann-banner-icon">' + ICON[lvl] + '</span>' +
                        '<span class="ann-banner-text"><span class="ann-banner-title">' + esc(ann.title) + '</span>' + bodyHtml + '</span>' +
                        '</div>';
                    navbar.insertAdjacentElement('afterend', el);
                })
                .catch(() => { });
        }

        function init() {
            document.getElementById('panel-merch').innerHTML = loading('Loading merchandise…');
            loadMerch();
            mountBanner();
        }
        init();
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>

</html>
